openapi: "3.1.0"
info:
  title: Statics Platform API
  version: "0.1.0"
  description: >
    API contract for the Statics Problem Platform.
    This file is the source of truth — edit it before implementing either side.
    Regenerate TS types with: pnpm --filter @statics/contract generate

servers:
  - url: http://localhost:8000
    description: Local development

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ---------------------------------------------------------------------------
  # Student auth
  # ---------------------------------------------------------------------------

  /api/v1/auth/student/register:
    post:
      operationId: registerStudent
      summary: Create a student account and start a session
      tags: [student-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentRegisterRequest"
      responses:
        "201":
          description: Account created; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAuthResponse"
        "409":
          description: An account with that PID already exists

  /api/v1/auth/student/login:
    post:
      operationId: loginStudent
      summary: Authenticate a student by PID and password
      tags: [student-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentLoginRequest"
      responses:
        "200":
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAuthResponse"
        "401":
          description: Invalid credentials

  # ---------------------------------------------------------------------------
  # Student dashboard
  # ---------------------------------------------------------------------------

  /api/v1/student/assignments:
    get:
      operationId: listStudentAssignments
      summary: Assignments visible to the signed-in student
      tags: [student]
      responses:
        "200":
          description: Assignment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentAssignmentListItem"
        "401":
          description: Not authenticated

  # ---------------------------------------------------------------------------
  # Assignments
  # ---------------------------------------------------------------------------

  /api/v1/assignments/{slug}:
    get:
      operationId: getAssignment
      summary: Get assignment summary
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Assignment summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSummary"
        "404":
          description: Assignment not found

  /api/v1/assignments/{slug}/problems/{index}:
    get:
      operationId: getProblem
      summary: Get a problem payload for the current student
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/index"
      responses:
        "200":
          description: Problem payload (no solution data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemPayload"
        "403":
          description: Assignment locked (already submitted)
        "404":
          description: Problem not found

  /api/v1/assignments/{slug}/problems/{index}/answers:
    put:
      operationId: saveAnswers
      summary: Save answers without checking
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/index"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswersRequest"
      responses:
        "200":
          description: Answers saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedResponse"
        "403":
          description: Assignment locked

  /api/v1/assignments/{slug}/problems/{index}/check:
    post:
      operationId: checkAnswers
      summary: Check answers against the solution
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/index"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswersRequest"
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "403":
          description: Assignment locked or max attempts reached
        "404":
          description: Problem not found

  /api/v1/assignments/{slug}/submit:
    post:
      operationId: submitAssignment
      summary: Finalize and submit the assignment
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Submission result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "409":
          description: Already submitted (idempotent — returns same result)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"

  /api/v1/assignments/{slug}/result:
    get:
      operationId: getResult
      summary: Get submission result (only available after submit)
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Submission result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "404":
          description: Not yet submitted

# =============================================================================
# Parameters
# =============================================================================

components:
  parameters:
    slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: Assignment slug (e.g. "truss-fall-2026")

    index:
      name: index
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: 1-based problem index within the assignment

  # ===========================================================================
  # Schemas
  # ===========================================================================

  schemas:

    # -------------------------------------------------------------------------
    # Health
    # -------------------------------------------------------------------------

    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: "0.1.0"

    # -------------------------------------------------------------------------
    # Student auth
    # -------------------------------------------------------------------------

    StudentRegisterRequest:
      type: object
      required: [pid, firstName, lastName, password]
      properties:
        pid:
          type: string
          description: Student PID (never appears in URLs or logs)
          example: A12345678
        firstName:
          type: string
          example: Koshik
        lastName:
          type: string
          example: Kumar
        password:
          type: string
          format: password
          minLength: 8

    StudentLoginRequest:
      type: object
      required: [pid, password]
      properties:
        pid:
          type: string
          example: A12345678
        password:
          type: string
          format: password

    StudentAuthResponse:
      type: object
      required: [student]
      properties:
        student:
          $ref: "#/components/schemas/StudentRecord"

    StudentRecord:
      type: object
      required: [id, firstName, lastName]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string

    StudentAssignmentListItem:
      type: object
      required: [slug, title, status, score, dueAt, problemCount]
      properties:
        slug:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [not_started, in_progress, submitted]
        score:
          type: object
          nullable: true
          required: [earned, total]
          properties:
            earned:
              type: number
            total:
              type: number
        dueAt:
          type: string
          format: date-time
          nullable: true
        problemCount:
          type: integer

    # -------------------------------------------------------------------------
    # Assignment
    # -------------------------------------------------------------------------

    AssignmentSummary:
      type: object
      required: [slug, title, problemCount, status, feedbackMode, maxAttempts, dueAt, locked, problems]
      properties:
        slug:
          type: string
        title:
          type: string
        problemCount:
          type: integer
        status:
          type: string
          enum: [not_started, in_progress, submitted]
        feedbackMode:
          type: string
          enum: [binary, per_field]
        maxAttempts:
          type: integer
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        locked:
          type: boolean
          description: True once submitted or past a hard close
        problems:
          type: array
          items:
            $ref: "#/components/schemas/ProblemSummary"
        score:
          type: object
          nullable: true
          required: [earned, total]
          properties:
            earned:
              type: number
            total:
              type: number

    ProblemSummary:
      type: object
      required: [index, status, attemptCount]
      properties:
        index:
          type: integer
        status:
          type: string
          enum: [no_attempt, incorrect, correct]
        attemptCount:
          type: integer

    # -------------------------------------------------------------------------
    # Problem payload
    # -------------------------------------------------------------------------

    ProblemPayload:
      type: object
      required: [schemaVersion, index, problemType, prompt, geometry, answerSchema, savedAnswers, attemptCount, maxAttempts, locked]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        index:
          type: integer
        problemType:
          type: string
          description: Drives the renderer registry (e.g. "truss")
        prompt:
          $ref: "#/components/schemas/Prompt"
        geometry:
          description: Opaque to the shell — typed per problemType by the renderer
        answerSchema:
          $ref: "#/components/schemas/AnswerSchema"
        savedAnswers:
          type: object
          additionalProperties:
            type: number
            nullable: true
        attemptCount:
          type: integer
        maxAttempts:
          type: integer
          nullable: true
        locked:
          type: boolean

    Prompt:
      type: object
      required: [title, body, notes]
      properties:
        title:
          type: string
        body:
          type: string
        notes:
          type: array
          items:
            type: string

    AnswerSchema:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/AnswerGroup"

    AnswerGroup:
      type: object
      required: [id, label, fields]
      properties:
        id:
          type: string
        label:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/AnswerField"

    AnswerField:
      type: object
      required: [key, label, type, decimals]
      properties:
        key:
          type: string
          description: Matches keys in savedAnswers and CheckResult.perField
        label:
          type: string
          description: Rendered label (e.g. "S₁")
        unit:
          type: string
          nullable: true
          example: F
        type:
          type: string
          enum: [number]
        decimals:
          type: integer
          nullable: true
          example: 2

    # -------------------------------------------------------------------------
    # TrussGeometry — concrete geometry type for problemType="truss"
    # (geometry field in ProblemPayload is opaque; this is the resolved shape)
    # -------------------------------------------------------------------------

    TrussGeometry:
      type: object
      required: [schemaVersion, nodes, members, supports, forces, bounds]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TrussNode"
        members:
          type: array
          items:
            $ref: "#/components/schemas/TrussMember"
        supports:
          type: array
          items:
            $ref: "#/components/schemas/TrussSupport"
        forces:
          type: array
          items:
            $ref: "#/components/schemas/TrussForce"
        bounds:
          $ref: "#/components/schemas/TrussBounds"

    TrussNode:
      type: object
      required: [id, x, y]
      properties:
        id:
          type: integer
        x:
          type: number
        y:
          type: number

    TrussMember:
      type: object
      required: [id, from, to, label]
      properties:
        id:
          type: integer
        from:
          type: integer
          description: Node id
        to:
          type: integer
          description: Node id
        label:
          type: string
          example: "S₁"

    TrussSupport:
      type: object
      required: [node, type, angleDeg]
      properties:
        node:
          type: integer
          description: Node id
        type:
          type: string
          enum: [pin, roller]
        angleDeg:
          type: number
          description: Rotation of support symbol in degrees (0 = base below node)

    TrussForce:
      type: object
      required: [node, fx, fy, label]
      properties:
        node:
          type: integer
          description: Node id
        fx:
          type: number
        fy:
          type: number
        label:
          type: string
          example: "3F"

    TrussBounds:
      type: object
      required: [xMin, xMax, yMin, yMax]
      properties:
        xMin:
          type: number
        xMax:
          type: number
        yMin:
          type: number
        yMax:
          type: number

    # -------------------------------------------------------------------------
    # Check + submission
    # -------------------------------------------------------------------------

    AnswersRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          additionalProperties:
            type: number
            nullable: true

    SavedResponse:
      type: object
      required: [savedAt]
      properties:
        savedAt:
          type: string
          format: date-time

    CheckResult:
      type: object
      required: [correct, perField, message, attemptCount, problemStatus]
      properties:
        correct:
          type: boolean
        perField:
          type: object
          nullable: true
          additionalProperties:
            type: boolean
          description: null when feedbackMode is binary
        message:
          type: string
        attemptCount:
          type: integer
        problemStatus:
          type: string
          enum: [no_attempt, incorrect, correct]

    SubmissionResult:
      type: object
      required: [submittedAt, score, problems]
      properties:
        submittedAt:
          type: string
          format: date-time
        score:
          type: object
          required: [earned, total]
          properties:
            earned:
              type: number
            total:
              type: number
        problems:
          type: array
          items:
            type: object
            required: [index, status, points]
            properties:
              index:
                type: integer
              status:
                type: string
                enum: [no_attempt, incorrect, correct]
              points:
                type: number
