openapi: "3.1.0"
info:
  title: Statics Platform API
  version: "0.1.0"
  description: >
    API contract for the Statics Problem Platform.
    This file is the source of truth — edit it before implementing either side.
    Regenerate TS types with: pnpm --filter @statics/contract generate

servers:
  - url: http://localhost:8000
    description: Local development

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ---------------------------------------------------------------------------
  # Student auth
  # ---------------------------------------------------------------------------

  /api/v1/auth/student/register:
    post:
      operationId: registerStudent
      summary: Create a student account and start a session
      tags: [student-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentRegisterRequest"
      responses:
        "201":
          description: Account created; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAuthResponse"
        "409":
          description: An account with that PID already exists

  /api/v1/auth/student/login:
    post:
      operationId: loginStudent
      summary: Authenticate a student by PID and password
      tags: [student-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentLoginRequest"
      responses:
        "200":
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAuthResponse"
        "401":
          description: Invalid credentials

  /api/v1/auth/student/logout:
    post:
      operationId: logoutStudent
      summary: Clear the student session cookie
      tags: [student-auth]
      responses:
        "200":
          description: Session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  # ---------------------------------------------------------------------------
  # Instructor auth
  #
  # Separate cookie and separate guard from the student routes: an instructor
  # session must never satisfy a student route or vice versa (ADR 0009).
  # ---------------------------------------------------------------------------

  /api/v1/auth/instructor/register:
    post:
      operationId: registerInstructor
      summary: Create an instructor account and start a session
      tags: [instructor-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructorRegisterRequest"
      responses:
        "201":
          description: Account created; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorAuthResponse"
        "409":
          description: An account with that email already exists
        "422":
          description: Malformed email or password below the minimum length

  /api/v1/auth/instructor/login:
    post:
      operationId: loginInstructor
      summary: Authenticate an instructor by email and password
      tags: [instructor-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructorLoginRequest"
      responses:
        "200":
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorAuthResponse"
        "401":
          description: Invalid credentials

  /api/v1/auth/instructor/logout:
    post:
      operationId: logoutInstructor
      summary: Clear the instructor session cookie
      tags: [instructor-auth]
      responses:
        "200":
          description: Session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/v1/auth/instructor/me:
    get:
      operationId: readInstructorMe
      summary: The signed-in instructor, resolved from the session cookie
      tags: [instructor-auth]
      responses:
        "200":
          description: Current instructor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorAuthResponse"
        "401":
          description: Not authenticated

  # ---------------------------------------------------------------------------
  # Student dashboard
  # ---------------------------------------------------------------------------

  /api/v1/student/assignments:
    get:
      operationId: listStudentAssignments
      summary: Assignments visible to the signed-in student
      tags: [student]
      responses:
        "200":
          description: Assignment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentAssignmentListItem"
        "401":
          description: Not authenticated

  /api/v1/student/courses:
    get:
      operationId: listStudentCourses
      summary: Courses the student has accepted an invitation to
      tags: [student]
      responses:
        "200":
          description: Course list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentCourseSummary"
        "401":
          description: Not authenticated

  # ---------------------------------------------------------------------------
  # Student — course invitations
  #
  # An instructor can roster a student before they have an account. On
  # registration the matching roster entry is claimed, and it surfaces here as a
  # pending invitation. Assignments only become visible once accepted.
  # Addressed by roster-entry UUID — never a PID (standing rule #7).
  # ---------------------------------------------------------------------------

  /api/v1/student/invitations:
    get:
      operationId: listStudentInvitations
      summary: Pending course invitations for the signed-in student
      tags: [student-invitations]
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentInvitation"
        "401":
          description: Not authenticated

  /api/v1/student/invitations/{entryId}/accept:
    post:
      operationId: acceptInvitation
      summary: Accept a course invitation
      description: >
        Idempotent: accepting an already-accepted invitation succeeds. Returns
        the joined course so the client can show it without a refetch.
      tags: [student-invitations]
      parameters:
        - $ref: "#/components/parameters/entryId"
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentCourseSummary"
        "404":
          description: No pending invitation with that id for this student
        "409":
          description: The invitation was already declined or the enrolment dropped

  /api/v1/student/invitations/{entryId}/decline:
    post:
      operationId: declineInvitation
      summary: Decline a course invitation
      tags: [student-invitations]
      parameters:
        - $ref: "#/components/parameters/entryId"
      responses:
        "200":
          description: Invitation declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: No pending invitation with that id for this student
        "409":
          description: The invitation was already accepted

  # ---------------------------------------------------------------------------
  # Assignments
  # ---------------------------------------------------------------------------

  /api/v1/assignments/{slug}:
    get:
      operationId: getAssignment
      summary: Get assignment summary
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Assignment summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSummary"
        "404":
          description: Assignment not found

  /api/v1/assignments/{slug}/problems/{index}:
    get:
      operationId: getProblem
      summary: Get a problem payload for the current student
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/index"
      responses:
        "200":
          description: Problem payload (no solution data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemPayload"
        "403":
          description: Assignment locked (already submitted)
        "404":
          description: Problem not found

  /api/v1/assignments/{slug}/problems/{index}/answers:
    put:
      operationId: saveAnswers
      summary: Save answers without checking
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/index"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswersRequest"
      responses:
        "200":
          description: Answers saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedResponse"
        "403":
          description: Assignment locked

  /api/v1/assignments/{slug}/problems/{index}/check:
    post:
      operationId: checkAnswers
      summary: Check answers against the solution
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/index"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswersRequest"
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "403":
          description: Assignment locked or max attempts reached
        "404":
          description: Problem not found

  /api/v1/assignments/{slug}/submit:
    post:
      operationId: submitAssignment
      summary: Finalize and submit the assignment
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Submission result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "409":
          description: Already submitted (idempotent — returns same result)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"

  /api/v1/assignments/{slug}/result:
    get:
      operationId: getResult
      summary: Get submission result (only available after submit)
      tags: [assignments]
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Submission result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "404":
          description: Not yet submitted

  # ---------------------------------------------------------------------------
  # Admin — courses
  #
  # All admin routes require an instructor session and a sufficient course role.
  # A course the caller has no role on returns 404, not 403, so course ids
  # cannot be enumerated. Roster entries are addressed by their own UUID —
  # a PID must never appear in a URL (standing rule #7).
  # ---------------------------------------------------------------------------

  /api/v1/admin/courses:
    get:
      operationId: listCourses
      summary: Courses the signed-in instructor has a role on
      tags: [admin-courses]
      responses:
        "200":
          description: Course list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseSummary"
        "401":
          description: Not authenticated
    post:
      operationId: createCourse
      summary: Create a course
      tags: [admin-courses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreateRequest"
      responses:
        "201":
          description: Course created; caller becomes owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseSummary"
        "409":
          description: A course with that code, term and section already exists

  /api/v1/admin/courses/{courseId}:
    get:
      operationId: getCourse
      summary: Course detail
      tags: [admin-courses]
      parameters:
        - $ref: "#/components/parameters/courseId"
      responses:
        "200":
          description: Course detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseSummary"
        "404":
          description: No such course, or caller has no role on it
    patch:
      operationId: updateCourse
      summary: Update course metadata
      tags: [admin-courses]
      parameters:
        - $ref: "#/components/parameters/courseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdateRequest"
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseSummary"
        "403":
          description: Insufficient course role
        "404":
          description: No such course

  # ---------------------------------------------------------------------------
  # Admin — roster
  # ---------------------------------------------------------------------------

  /api/v1/admin/courses/{courseId}/roster:
    get:
      operationId: listRoster
      summary: Roster entries for a course, claimed and unclaimed alike
      tags: [admin-roster]
      parameters:
        - $ref: "#/components/parameters/courseId"
      responses:
        "200":
          description: Roster entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterEntry"
        "404":
          description: No such course
    post:
      operationId: addRosterEntries
      summary: Add roster entries in bulk, by PID and/or email
      description: >
        Entries may name students who have no account yet; `studentId` stays
        null until an account claims the entry. Returns one result per
        submitted row so partial failures are visible rather than silent.
      tags: [admin-roster]
      parameters:
        - $ref: "#/components/parameters/courseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterImportRequest"
      responses:
        "200":
          description: Per-row outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterImportResult"
        "403":
          description: Insufficient course role
        "404":
          description: No such course

  /api/v1/admin/courses/{courseId}/roster/{entryId}:
    patch:
      operationId: updateRosterEntry
      summary: Change a roster entry's status (e.g. drop a student)
      tags: [admin-roster]
      parameters:
        - $ref: "#/components/parameters/courseId"
        - $ref: "#/components/parameters/entryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterEntryUpdateRequest"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterEntry"
        "403":
          description: Insufficient course role
        "404":
          description: No such course or entry

  # ---------------------------------------------------------------------------
  # Admin — assignments
  #
  # The problem-type catalogue drives the builder's difficulty form, so no admin
  # component needs to know about any specific problem type.
  # ---------------------------------------------------------------------------

  /api/v1/admin/problem-types:
    get:
      operationId: listProblemTypes
      summary: Registered problem types and their configurable params
      tags: [admin-assignments]
      responses:
        "200":
          description: Problem type catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProblemTypeInfo"
        "401":
          description: Not authenticated

  /api/v1/admin/courses/{courseId}/assignments:
    get:
      operationId: listCourseAssignments
      summary: Assignments in a course
      tags: [admin-assignments]
      parameters:
        - $ref: "#/components/parameters/courseId"
      responses:
        "200":
          description: Assignment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAssignmentSummary"
        "404":
          description: No such course
    post:
      operationId: createAssignment
      summary: Create a draft assignment with its problem slots
      tags: [admin-assignments]
      parameters:
        - $ref: "#/components/parameters/courseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentCreateRequest"
      responses:
        "201":
          description: Draft created — not visible to students until published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAssignmentDetail"
        "403":
          description: Insufficient course role
        "409":
          description: That slug is already used in this course

  /api/v1/admin/assignments/{assignmentId}:
    get:
      operationId: getAdminAssignment
      summary: Assignment detail, including problem slots and targeting
      tags: [admin-assignments]
      parameters:
        - $ref: "#/components/parameters/assignmentId"
      responses:
        "200":
          description: Assignment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAssignmentDetail"
        "404":
          description: No such assignment, or caller has no role on its course
    patch:
      operationId: updateAssignment
      summary: Update settings, problem slots and/or targeting
      description: >
        Every field is optional; omitted fields are left alone. `problems` and
        `targets` replace their collection wholesale when present.
      tags: [admin-assignments]
      parameters:
        - $ref: "#/components/parameters/assignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentUpdateRequest"
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAssignmentDetail"
        "403":
          description: Insufficient course role
        "404":
          description: No such assignment
        "409":
          description: That slug is already used in this course

  /api/v1/admin/assignments/{assignmentId}/publish:
    post:
      operationId: publishAssignment
      summary: Publish or unpublish an assignment
      description: >
        Publishing is what makes an assignment visible to targeted students.
        Rejected when the assignment has no problem slots, since a published
        empty assignment is a dead end for the student.
      tags: [admin-assignments]
      parameters:
        - $ref: "#/components/parameters/assignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAssignmentDetail"
        "403":
          description: Insufficient course role
        "409":
          description: Cannot publish an assignment with no problems
        "404":
          description: No such assignment

  /api/v1/admin/assignments/{assignmentId}/preview/{index}:
    get:
      operationId: previewAssignmentProblem
      summary: Render one problem slot as a student would see it
      description: >
        Instructor-only. Returns the same payload shape a student receives, so
        the builder can reuse the problem renderer. Carries no solution data —
        the separate replay route is the only solution-bearing endpoint.
      tags: [admin-assignments]
      parameters:
        - $ref: "#/components/parameters/assignmentId"
        - $ref: "#/components/parameters/index"
        - name: seed
          in: query
          required: false
          schema:
            type: integer
          description: Reroll the preview with a specific seed
      responses:
        "200":
          description: Problem payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemPayload"
        "404":
          description: No such assignment or problem index

  /api/v1/admin/assignments/{assignmentId}/gradebook:
    get:
      operationId: getAssignmentGradebook
      summary: Every targeted student's score and per-problem status
      description: >
        Instructor-only. Available at any time, including while the assignment
        is still open, so staff can watch progress live. Students who never
        opened the assignment appear with status `not_started`.
      tags: [admin-grades]
      parameters:
        - $ref: "#/components/parameters/assignmentId"
      responses:
        "200":
          description: Gradebook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradebookResponse"
        "404":
          description: No such assignment

  /api/v1/admin/assignments/{assignmentId}/analytics:
    get:
      operationId: getAssignmentAnalytics
      summary: Summary statistics for an assignment
      description: >
        Instructor-only. Score distribution, completion counts, and per-problem
        success rates. Non-gradeable problem types are excluded from the
        per-problem denominators.
      tags: [admin-grades]
      parameters:
        - $ref: "#/components/parameters/assignmentId"
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentAnalytics"
        "404":
          description: No such assignment

  # ---------------------------------------------------------------------------
  # Admin — course staff
  # ---------------------------------------------------------------------------

  /api/v1/admin/courses/{courseId}/staff:
    get:
      operationId: listCourseStaff
      summary: Instructors and TAs with a role on the course
      tags: [admin-staff]
      parameters:
        - $ref: "#/components/parameters/courseId"
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseStaffMember"
        "404":
          description: No such course
    post:
      operationId: addCourseStaff
      summary: Grant an instructor a role on the course
      tags: [admin-staff]
      parameters:
        - $ref: "#/components/parameters/courseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseStaffAddRequest"
      responses:
        "201":
          description: Staff member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseStaffMember"
        "403":
          description: Only an owner may change course staff
        "404":
          description: No such course or no instructor with that email
        "409":
          description: That instructor already has a role on the course

# =============================================================================
# Parameters
# =============================================================================

components:
  parameters:
    slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: Assignment slug (e.g. "truss-fall-2026")

    index:
      name: index
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: 1-based problem index within the assignment

    courseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Internal course UUID

    assignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Internal assignment UUID

    entryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Internal roster-entry UUID (never a PID — standing rule #7)

  # ===========================================================================
  # Schemas
  # ===========================================================================

  schemas:

    # -------------------------------------------------------------------------
    # Health
    # -------------------------------------------------------------------------

    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: "0.1.0"

    # -------------------------------------------------------------------------
    # Student auth
    # -------------------------------------------------------------------------

    StudentRegisterRequest:
      type: object
      required: [pid, firstName, lastName, password]
      properties:
        pid:
          type: string
          description: Student PID (never appears in URLs or logs)
          example: A12345678
        firstName:
          type: string
          example: Koshik
        lastName:
          type: string
          example: Kumar
        password:
          type: string
          format: password
          minLength: 8

    StudentLoginRequest:
      type: object
      required: [pid, password]
      properties:
        pid:
          type: string
          example: A12345678
        password:
          type: string
          format: password

    StudentAuthResponse:
      type: object
      required: [student]
      properties:
        student:
          $ref: "#/components/schemas/StudentRecord"

    StudentRecord:
      type: object
      required: [id, firstName, lastName]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    # -------------------------------------------------------------------------
    # Instructor auth
    # -------------------------------------------------------------------------

    InstructorRegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Prof. Marko
        email:
          type: string
          description: Stored lowercased so lookups and roster matching agree
          example: marko@ucsd.edu
        password:
          type: string
          format: password
          minLength: 8

    InstructorLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: marko@ucsd.edu
        password:
          type: string
          format: password

    InstructorAuthResponse:
      type: object
      required: [instructor]
      properties:
        instructor:
          $ref: "#/components/schemas/InstructorRecord"

    InstructorRecord:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string

    # -------------------------------------------------------------------------
    # Admin — courses, roster, staff
    # -------------------------------------------------------------------------

    CourseRole:
      type: string
      description: Ordered least- to most-privileged
      enum: [reader, ta, instructor, owner]

    CourseSummary:
      type: object
      required:
        [id, code, term, section, title, isArchived, studentCount, pendingInviteCount,
         assignmentCount, viewerRole]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: MAE-008
        term:
          type: string
          example: Fall 2026
        section:
          type: string
          example: "001"
        title:
          type: string
          example: Statics
        isArchived:
          type: boolean
        studentCount:
          type: integer
          description: Roster entries with status `active`
        pendingInviteCount:
          type: integer
          description: Roster entries still `invited`
        assignmentCount:
          type: integer
        viewerRole:
          $ref: "#/components/schemas/CourseRole"

    CourseCreateRequest:
      type: object
      required: [code, term]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        term:
          type: string
          minLength: 1
          maxLength: 64
        section:
          type: string
          maxLength: 32
        title:
          type: string
          maxLength: 255

    CourseUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        isArchived:
          type: boolean

    RosterEntryStatus:
      type: string
      description: >
        `invited` until the student accepts. Assignments only become visible at
        `active`.
      enum: [invited, active, declined, dropped]

    RosterEntry:
      type: object
      required: [id, status, pid, email, firstName, lastName, hasAccount, invitedAt, acceptedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RosterEntryStatus"
        pid:
          type: string
          nullable: true
          description: Normalized; null when the entry was added by email only
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        hasAccount:
          type: boolean
          description: >
            True once a registered account has claimed this entry. False means
            the student was rostered ahead of signing up.
        invitedAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true

    RosterImportRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/RosterImportEntry"

    RosterImportEntry:
      type: object
      description: At least one of `pid` or `email` must be present
      properties:
        pid:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true

    RosterImportOutcome:
      type: string
      enum: [added, already_present, linked_existing_account, invalid]

    RosterImportRowResult:
      type: object
      required: [row, outcome, pid, email, message]
      properties:
        row:
          type: integer
          description: 1-based index into the submitted entries
        outcome:
          $ref: "#/components/schemas/RosterImportOutcome"
        pid:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
          description: Reason, when the outcome is `invalid`

    RosterImportResult:
      type: object
      required: [added, alreadyPresent, linked, invalid, results]
      properties:
        added:
          type: integer
        alreadyPresent:
          type: integer
        linked:
          type: integer
        invalid:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/RosterImportRowResult"

    RosterEntryUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/RosterEntryStatus"

    # -------------------------------------------------------------------------
    # Admin — assignments
    # -------------------------------------------------------------------------

    ParamFieldSpec:
      type: object
      description: One configurable generator knob, described so a UI can render it
      required: [name, label, valueType, default, minimum, maximum, step, helpText]
      properties:
        name:
          type: string
          description: Key written into the problem slot's params
        label:
          type: string
        valueType:
          type: string
          enum: [integer, number]
        default:
          type: number
          description: Used when the instructor leaves the field alone
        minimum:
          type: number
          nullable: true
        maximum:
          type: number
          nullable: true
        step:
          type: number
          nullable: true
        helpText:
          type: string

    ProblemTypeInfo:
      type: object
      required: [problemType, displayName, paramsSchema]
      properties:
        problemType:
          type: string
          description: Drives the renderer registry
          example: truss
        displayName:
          type: string
          example: Planar truss
        paramsSchema:
          type: array
          items:
            $ref: "#/components/schemas/ParamFieldSpec"

    FeedbackMode:
      type: string
      enum: [binary, per_field]

    AssignmentAudience:
      type: string
      description: >
        `all` is evaluated at request time, so students who join the course
        later are included without re-assigning. `selected` uses an explicit
        target list.
      enum: [all, selected]

    AdminProblemSlot:
      type: object
      required: [orderIndex, problemType, params, points]
      properties:
        orderIndex:
          type: integer
          minimum: 1
          description: 1-based position in the assignment
        problemType:
          type: string
        params:
          type: object
          additionalProperties:
            type: number
          description: Keys come from the problem type's paramsSchema
        points:
          type: number
          default: 1

    AdminAssignmentSummary:
      type: object
      required:
        [id, courseId, slug, title, isPublished, audience, problemCount,
         targetedStudentCount, dueAt, opensAt, hardDeadlineAt, allowLate,
         latePenaltyRate, revealSolutionsAfterClose]
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        isPublished:
          type: boolean
        audience:
          $ref: "#/components/schemas/AssignmentAudience"
        problemCount:
          type: integer
        targetedStudentCount:
          type: integer
        dueAt:
          type: string
          format: date-time
          nullable: true
        opensAt:
          type: string
          format: date-time
          nullable: true
        hardDeadlineAt:
          type: string
          format: date-time
          nullable: true
          description: Absolute cutoff; only meaningful when allowLate is true
        allowLate:
          type: boolean
        latePenaltyRate:
          type: number
        revealSolutionsAfterClose:
          type: boolean
          description: >
            When true, students may see reference solutions once the assignment
            has closed. Default false — solutions never leave the backend.

    AdminAssignmentDetail:
      allOf:
        - $ref: "#/components/schemas/AdminAssignmentSummary"
        - type: object
          required:
            [instructions, tolerance, feedbackMode, maxAttempts, problems, targetEntryIds]
          properties:
            instructions:
              type: string
            tolerance:
              type: number
            feedbackMode:
              $ref: "#/components/schemas/FeedbackMode"
            maxAttempts:
              type: integer
              nullable: true
              description: null means unlimited
            problems:
              type: array
              items:
                $ref: "#/components/schemas/AdminProblemSlot"
            targetEntryIds:
              type: array
              description: Roster-entry ids; only meaningful when audience is `selected`
              items:
                type: string
                format: uuid

    GradebookResponse:
      type: object
      required: [assignmentId, slug, title, totalPoints, closesAt, problems, rows]
      properties:
        assignmentId:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        totalPoints:
          type: number
        closesAt:
          type: string
          format: date-time
          nullable: true
        problems:
          type: array
          items:
            $ref: "#/components/schemas/GradebookProblemColumn"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/GradebookRow"

    GradebookProblemColumn:
      type: object
      required: [index, problemType, points, gradeable]
      properties:
        index:
          type: integer
        problemType:
          type: string
        points:
          type: number
        gradeable:
          type: boolean
          description: False for problem types with no server-side solver yet

    GradebookRow:
      type: object
      required:
        [studentId, displayName, externalId, status, earned, total,
         submittedAt, lastActivityAt, problems]
      properties:
        studentId:
          type: string
          format: uuid
          description: Internal UUID — never the PID
        displayName:
          type: string
        externalId:
          type: string
          description: Course-facing student identifier
        status:
          type: string
          enum: [not_started, in_progress, submitted, closed]
        earned:
          type: number
          nullable: true
          description: null until the assignment closes for this student
        total:
          type: number
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: Set only when the student pressed Submit
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
        problems:
          type: array
          items:
            $ref: "#/components/schemas/GradebookCell"

    GradebookCell:
      type: object
      required: [index, status, attemptCount]
      properties:
        index:
          type: integer
        status:
          type: string
          enum: [no_attempt, incorrect, correct]
        attemptCount:
          type: integer

    AssignmentAnalytics:
      type: object
      required:
        [assignmentId, slug, title, totalPoints, closesAt, studentCount,
         startedCount, submittedCount, closedCount, gradedCount, meanScore,
         medianScore, minScore, maxScore, problems]
      properties:
        assignmentId:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        totalPoints:
          type: number
        closesAt:
          type: string
          format: date-time
          nullable: true
        studentCount:
          type: integer
          description: Students the assignment targets
        startedCount:
          type: integer
        submittedCount:
          type: integer
          description: Pressed Submit
        closedCount:
          type: integer
          description: Final by submit or deadline
        gradedCount:
          type: integer
          description: Rows the score statistics are computed over
        meanScore:
          type: number
          nullable: true
        medianScore:
          type: number
          nullable: true
        minScore:
          type: number
          nullable: true
        maxScore:
          type: number
          nullable: true
        problems:
          type: array
          items:
            $ref: "#/components/schemas/ProblemAnalytics"

    ProblemAnalytics:
      type: object
      required:
        [index, problemType, gradeable, attemptedCount, correctCount,
         successRate, meanAttempts]
      properties:
        index:
          type: integer
        problemType:
          type: string
        gradeable:
          type: boolean
        attemptedCount:
          type: integer
        correctCount:
          type: integer
        successRate:
          type: number
          nullable: true
          description: correctCount / attemptedCount; null when nobody attempted
        meanAttempts:
          type: number
          nullable: true

    AssignmentCreateRequest:
      type: object
      required: [title, slug]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 128
        instructions:
          type: string
        dueAt:
          type: string
          format: date-time
          nullable: true
        opensAt:
          type: string
          format: date-time
          nullable: true
        hardDeadlineAt:
          type: string
          format: date-time
          nullable: true
          description: Absolute cutoff; only meaningful when allowLate is true
        allowLate:
          type: boolean
        latePenaltyRate:
          type: number
        revealSolutionsAfterClose:
          type: boolean
          description: >
            When true, students may see reference solutions once the assignment
            has closed. Default false — solutions never leave the backend.
        tolerance:
          type: number
        feedbackMode:
          $ref: "#/components/schemas/FeedbackMode"
        maxAttempts:
          type: integer
          nullable: true
        audience:
          $ref: "#/components/schemas/AssignmentAudience"
        targetEntryIds:
          type: array
          items:
            type: string
            format: uuid
        problems:
          type: array
          items:
            $ref: "#/components/schemas/AdminProblemSlot"

    AssignmentUpdateRequest:
      type: object
      description: All fields optional; omitted fields are left unchanged
      properties:
        title:
          type: string
        slug:
          type: string
        instructions:
          type: string
        dueAt:
          type: string
          format: date-time
          nullable: true
        opensAt:
          type: string
          format: date-time
          nullable: true
        hardDeadlineAt:
          type: string
          format: date-time
          nullable: true
          description: Absolute cutoff; only meaningful when allowLate is true
        allowLate:
          type: boolean
        latePenaltyRate:
          type: number
        revealSolutionsAfterClose:
          type: boolean
          description: >
            When true, students may see reference solutions once the assignment
            has closed. Default false — solutions never leave the backend.
        tolerance:
          type: number
        feedbackMode:
          $ref: "#/components/schemas/FeedbackMode"
        maxAttempts:
          type: integer
          nullable: true
        audience:
          $ref: "#/components/schemas/AssignmentAudience"
        targetEntryIds:
          type: array
          items:
            type: string
            format: uuid
        problems:
          type: array
          items:
            $ref: "#/components/schemas/AdminProblemSlot"

    PublishRequest:
      type: object
      required: [isPublished]
      properties:
        isPublished:
          type: boolean

    CourseStaffMember:
      type: object
      required: [id, instructorId, name, email, role]
      properties:
        id:
          type: string
          format: uuid
        instructorId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/CourseRole"

    CourseStaffAddRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
        role:
          $ref: "#/components/schemas/CourseRole"

    # -------------------------------------------------------------------------
    # Student — courses and invitations
    # -------------------------------------------------------------------------

    StudentCourseRef:
      type: object
      description: Minimal course identity, for grouping a student's assignments
      required: [id, code, term, title]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: MAE-008
        term:
          type: string
          example: Fall 2026
        title:
          type: string
          example: Statics

    StudentCourseSummary:
      type: object
      required: [id, code, term, section, title, instructorName, assignmentCount, enrolledAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        term:
          type: string
        section:
          type: string
        title:
          type: string
        instructorName:
          type: string
        assignmentCount:
          type: integer
        enrolledAt:
          type: string
          format: date-time

    StudentInvitation:
      type: object
      required: [id, course, instructorName, invitedAt, assignmentCount]
      properties:
        id:
          type: string
          format: uuid
          description: Roster-entry id, used to accept or decline
        course:
          $ref: "#/components/schemas/StudentCourseRef"
        instructorName:
          type: string
          example: Prof. Marko
        invitedAt:
          type: string
          format: date-time
        assignmentCount:
          type: integer
          description: Assignments waiting behind this invitation

    StudentAssignmentListItem:
      type: object
      required: [slug, title, status, score, dueAt, problemCount, course]
      properties:
        course:
          $ref: "#/components/schemas/StudentCourseRef"
        slug:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [not_started, in_progress, submitted]
        score:
          type: object
          nullable: true
          required: [earned, total]
          properties:
            earned:
              type: number
            total:
              type: number
        dueAt:
          type: string
          format: date-time
          nullable: true
        problemCount:
          type: integer

    # -------------------------------------------------------------------------
    # Assignment
    # -------------------------------------------------------------------------

    AssignmentSummary:
      type: object
      required: [slug, title, problemCount, status, feedbackMode, maxAttempts, dueAt, locked, problems, lockReason, closesAt, revealSolutions]
      properties:
        slug:
          type: string
        title:
          type: string
        problemCount:
          type: integer
        status:
          type: string
          enum: [not_started, in_progress, submitted, closed]
          description: >
            `closed` means the deadline passed without an explicit submit; the
            work is final and read-only but was never hand-submitted.
        feedbackMode:
          type: string
          enum: [binary, per_field]
        maxAttempts:
          type: integer
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        locked:
          type: boolean
          description: True once submitted or past the effective close time
        lockReason:
          type: string
          enum: [submitted, past_due]
          nullable: true
          description: Why the assignment is read-only; null while open
        closesAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Effective close time under the late policy. null means the
            assignment never auto-closes.
        revealSolutions:
          type: boolean
          description: >
            True only when the assignment is closed AND the instructor enabled
            solution reveal. Never a rule the client enforces — it only tells
            the UI whether `correctAnswers` will be populated.
        problems:
          type: array
          items:
            $ref: "#/components/schemas/ProblemSummary"
        score:
          type: object
          nullable: true
          required: [earned, total]
          properties:
            earned:
              type: number
            total:
              type: number

    ProblemSummary:
      type: object
      required: [index, status, attemptCount, locked]
      properties:
        index:
          type: integer
        status:
          type: string
          enum: [no_attempt, incorrect, correct]
        attemptCount:
          type: integer
        locked:
          type: boolean
          description: True when already answered correctly or the assignment closed

    # -------------------------------------------------------------------------
    # Problem payload
    # -------------------------------------------------------------------------

    ProblemPayload:
      type: object
      required: [schemaVersion, index, problemType, prompt, geometry, answerSchema, savedAnswers, attemptCount, maxAttempts, locked, lockReason, correctAnswers]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        index:
          type: integer
        problemType:
          type: string
          description: Drives the renderer registry (e.g. "truss")
        prompt:
          $ref: "#/components/schemas/Prompt"
        geometry:
          description: Opaque to the shell — typed per problemType by the renderer
        answerSchema:
          $ref: "#/components/schemas/AnswerSchema"
        savedAnswers:
          type: object
          additionalProperties:
            type: number
            nullable: true
        attemptCount:
          type: integer
        maxAttempts:
          type: integer
          nullable: true
        locked:
          type: boolean
          description: >
            True when this problem is read-only — either already answered
            correctly, or the whole assignment closed.
        lockReason:
          type: string
          enum: [correct, submitted, past_due, unavailable]
          nullable: true
          description: >
            `unavailable` means this problem type has no server-side solver
            yet, so it can be displayed but not answered.
        correctAnswers:
          type: object
          nullable: true
          additionalProperties:
            type: number
          description: >
            Reference solution, keyed like `savedAnswers`. Populated ONLY when
            the assignment is closed AND the instructor enabled solution
            reveal; null in every other case.

    Prompt:
      type: object
      required: [title, body, notes]
      properties:
        title:
          type: string
        body:
          type: string
        notes:
          type: array
          items:
            type: string

    AnswerSchema:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/AnswerGroup"

    AnswerGroup:
      type: object
      required: [id, label, fields]
      properties:
        id:
          type: string
        label:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/AnswerField"

    AnswerField:
      type: object
      required: [key, label, type, decimals]
      properties:
        key:
          type: string
          description: Matches keys in savedAnswers and CheckResult.perField
        label:
          type: string
          description: Rendered label (e.g. "S₁")
        unit:
          type: string
          nullable: true
          example: F
        type:
          type: string
          enum: [number]
        decimals:
          type: integer
          nullable: true
          example: 2

    # -------------------------------------------------------------------------
    # TrussGeometry — concrete geometry type for problemType="truss"
    # (geometry field in ProblemPayload is opaque; this is the resolved shape)
    # -------------------------------------------------------------------------

    TrussGeometry:
      type: object
      required: [schemaVersion, nodes, members, supports, forces, bounds]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TrussNode"
        members:
          type: array
          items:
            $ref: "#/components/schemas/TrussMember"
        supports:
          type: array
          items:
            $ref: "#/components/schemas/TrussSupport"
        forces:
          type: array
          items:
            $ref: "#/components/schemas/TrussForce"
        bounds:
          $ref: "#/components/schemas/TrussBounds"

    TrussNode:
      type: object
      required: [id, x, y]
      properties:
        id:
          type: integer
        x:
          type: number
        y:
          type: number

    TrussMember:
      type: object
      required: [id, from, to, label]
      properties:
        id:
          type: integer
        from:
          type: integer
          description: Node id
        to:
          type: integer
          description: Node id
        label:
          type: string
          example: "S₁"

    TrussSupport:
      type: object
      required: [node, type, angleDeg]
      properties:
        node:
          type: integer
          description: Node id
        type:
          type: string
          enum: [pin, roller]
        angleDeg:
          type: number
          description: Rotation of support symbol in degrees (0 = base below node)

    TrussForce:
      type: object
      required: [node, fx, fy, label]
      properties:
        node:
          type: integer
          description: Node id
        fx:
          type: number
        fy:
          type: number
        label:
          type: string
          example: "3F"

    TrussBounds:
      type: object
      required: [xMin, xMax, yMin, yMax]
      properties:
        xMin:
          type: number
        xMax:
          type: number
        yMin:
          type: number
        yMax:
          type: number

    # -------------------------------------------------------------------------
    # Check + submission
    # -------------------------------------------------------------------------

    AnswersRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          additionalProperties:
            type: number
            nullable: true

    SavedResponse:
      type: object
      required: [savedAt]
      properties:
        savedAt:
          type: string
          format: date-time

    CheckResult:
      type: object
      required: [correct, perField, message, attemptCount, problemStatus]
      properties:
        correct:
          type: boolean
        perField:
          type: object
          nullable: true
          additionalProperties:
            type: boolean
          description: null when feedbackMode is binary
        message:
          type: string
        attemptCount:
          type: integer
        problemStatus:
          type: string
          enum: [no_attempt, incorrect, correct]

    SubmissionResult:
      type: object
      required: [submittedAt, score, problems]
      properties:
        submittedAt:
          type: string
          format: date-time
        score:
          type: object
          required: [earned, total]
          properties:
            earned:
              type: number
            total:
              type: number
        problems:
          type: array
          items:
            type: object
            required: [index, status, points]
            properties:
              index:
                type: integer
              status:
                type: string
                enum: [no_attempt, incorrect, correct]
              points:
                type: number
