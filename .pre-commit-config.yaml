repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: docker compose run --rm backend mypy --strict app/
        language: system
        files: ^backend/app/
        pass_filenames: false

      - id: tsc
        name: tsc
        entry: pnpm --filter frontend typecheck
        language: system
        files: ^frontend/src/
        pass_filenames: false

      - id: eslint
        name: eslint
        entry: pnpm --filter frontend lint
        language: system
        files: ^frontend/src/
        pass_filenames: false
